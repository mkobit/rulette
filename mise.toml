[tools]
node = "22"
"npm:markdownlint-cli2" = "0.17.1"
rust = { version = "1.94.1", components = ["rustfmt", "clippy", "llvm-tools-preview"] }
"npm:@fission-ai/openspec" = "1.3.1"
"github:gastownhall/beads" = "1.2.2"

[settings]
locked = true
http_timeout = "300s"
http_retries = 15

# Thin wrappers over existing commands so common flows run via one pre-approved
# `mise run <task>` entrypoint instead of prompting per command.
# Not a build system: single commands or simple && chains only, no deps/conditionals.

[tasks.build]
run = "cargo build"
description = "Build all binaries and library"

[tasks.fmt]
run = "cargo fmt --check"
description = "Check formatting"

[tasks.lint]
run = "cargo clippy -- -D warnings"
description = "Lint Rust code with clippy"

[tasks."lint:md"]
run = "markdownlint-cli2"
description = "Lint markdown files"

[tasks.test]
run = "cargo test"
description = "Run all tests"

[tasks.check]
run = "markdownlint-cli2 && cargo fmt --check && cargo clippy -- -D warnings && cargo test"
description = "Run quality gates in CI order (lint:md -> fmt -> lint:rust -> test)"

[tasks.bd-push]
run = "bd dolt push"
description = "Push the beads Dolt database to its remote"

[tasks.bd-sync]
run = "git pull --rebase && bd dolt push && git push && git status"
description = "Session-completion sync: rebase, push beads, push git, show status"

[tasks.bd-check]
run = "bd ready && bd lint"
description = "Show unblocked work and validate the beads database"

[tasks.spec-list]
run = "npx @fission-ai/openspec list"
description = "List OpenSpec changes"

[tasks.spec-validate]
run = "npx @fission-ai/openspec validate --strict --all"
description = "Validate OpenSpec changes strictly"
