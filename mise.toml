[tools]
bun = "1.4.0"
"github:gastownhall/beads" = "1.2.2"
rust = { version = "1.98.0", components = ["rustfmt", "clippy", "llvm-tools-preview"] }

[settings]
locked = true
http_timeout = "300s"
http_retries = 15

# Declarative task definitions utilizing Mise DAG execution engine for parallel execution and clear status reporting.

[tasks.build]
run = "cargo build"
description = "Build all binaries and library"

[tasks."check:cargo"]
run = "cargo check"
description = "Check compilation without code generation"

[tasks.fmt]
run = "cargo fmt --check"
description = "Check formatting"

[tasks.lint]
run = "cargo clippy -- -D warnings"
description = "Lint Rust code with clippy"

[tasks."lint:md"]
run = "bun x markdownlint-cli2"
description = "Lint markdown files"

[tasks.test]
run = "cargo test"
description = "Run all tests"

[tasks.check]
depends = ["spec-validate", "lint:md", "fmt", "lint", "test"]
description = "Run quality gates in parallel using Mise DAG dependencies"
[tasks.bd-push]
run = "bd dolt push"
description = "Push the beads Dolt database to its remote"

[tasks.bd-sync]
run = "git pull --rebase && bd dolt push && git push && git status"
description = "Session-completion sync: rebase, push beads, push git, show status"

[tasks.bd-check]
run = "bd ready && bd lint"
description = "Show unblocked work and validate the beads database"

[tasks.spec-list]
run = "bun x @fission-ai/openspec list"
description = "List OpenSpec changes"

[tasks.spec-validate]
run = "bun x @fission-ai/openspec validate --strict --all"
description = "Validate OpenSpec changes strictly"
