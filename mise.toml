[tools]
node = "22"
"npm:markdownlint-cli2" = "0.17.1"
rust = { version = "1.94.1", components = ["rustfmt", "clippy"] }
gemini-cli = "latest"

[tasks."lint:md"]
description = "Lint markdown files"
run = "markdownlint-cli2"

[tasks."lint:rust"]
description = "Lint Rust code"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --check"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.check]
description = "Check everything"
depends = ["lint:md", "lint:rust", "fmt", "test"]
