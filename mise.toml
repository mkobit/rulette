[settings]
http_timeout = "300s"
lockfile = true
http_retries = 3
[tools]
node = "22"
"npm:markdownlint-cli2" = "0.17.1"
rust = { version = "1.94.1", components = ["rustfmt", "clippy", "llvm-tools-preview"] }
"npm:@fission-ai/openspec" = "1.3.1"
"github:gastownhall/beads" = "1.2.2"

[tasks."lint:md"]
description = "Lint markdown files"
run = "markdownlint-cli2"

[tasks."lint:rust"]
description = "Lint Rust code"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --check"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.check]
description = "Check everything"
depends = ["lint:md", "lint:rust", "fmt", "test"]

[tasks.bd-push]
description = "Push the beads Dolt database to its remote"
run = "bd dolt push"

[tasks.bd-sync]
description = "Session-completion sync: rebase, push beads, push git, show status"
run = "git pull --rebase && bd dolt push && git push && git status"

[tasks.bd-check]
description = "Show unblocked work and validate the beads database"
run = "bd ready && bd lint"

[tasks.spec-list]
description = "List OpenSpec changes"
run = "npx @fission-ai/openspec list"

[tasks.spec-validate]
description = "Validate OpenSpec changes strictly"
run = "npx @fission-ai/openspec validate --strict --all"



