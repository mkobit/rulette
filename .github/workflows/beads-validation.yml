name: Beads validation

on:
  schedule:
    - cron: '0 12 * * 3'
  workflow_dispatch: {}

env:
  MISE_VERSION: "v2026.8.11"

concurrency:
  group: beads-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit beads database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_USE_VERSIONS_HOST: 1

      - name: Bootstrap beads database from git remote
        # The Dolt database (.beads/embeddeddolt/) is gitignored and lives on
        # refs/dolt/data. A fresh checkout has no database, so bootstrap it from
        # the remote before auditing. BD_SYNC_REMOTE overrides the git+ssh sync
        # remote in config.yaml with the HTTPS repo URL, which needs no SSH key;
        # for this public repo the fetch is anonymous.
        env:
          BD_SYNC_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: bd bootstrap --yes

      - name: Validate beads ready work and lint
        run: mise run bd-check
