name: OpenSpec

on:
  push:
    branches: ['main']
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
  workflow_dispatch: {}

env:
  BUN_VERSION: "1.3.14"
  OPENSPEC_VERSION: "1.8.0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate OpenSpec specs and changes
        run: bun x @fission-ai/openspec@${{ env.OPENSPEC_VERSION }} validate --strict --all
