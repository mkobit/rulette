name: OpenSpec

on:
  push:
    branches: ['main']
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
  workflow_dispatch: {}

env:
  MISE_VERSION: "v2026.8.11"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_USE_VERSIONS_HOST: 1
      - name: Validate OpenSpec specs and changes
        run: mise run spec-validate
