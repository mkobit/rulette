name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions: {}

env:
  MISE_VERSION: "v2026.9.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-package:
    name: Validate and package static Linux release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install static-linking tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools binutils file

      - name: Install static Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Validate release tag
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            printf 'The release tag must point to a commit in main.\n' >&2
            exit 1
          fi
          package_version="$(scripts/cargo-package-version.sh)"
          readonly package_version
          if [[ "${GITHUB_REF_NAME}" != "${package_version}" ]]; then
            printf 'release tag %s does not match Cargo package version %s\n' "${GITHUB_REF_NAME}" "${package_version}" >&2
            exit 1
          fi

          readonly pattern='^([1-9][0-9]{3})\.([1-9][0-9]?)\.([1-9][0-9]?)(-rc\.[1-9][0-9]*)?$'
          if [[ ! "${package_version}" =~ ${pattern} ]]; then
            printf 'use an unpadded CalVer date with an optional -rc.N suffix\n' >&2
            exit 1
          fi
          date -u -d "${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}" +'%F' >/dev/null

      - name: Run quality gates
        run: mise run check

      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage gate
        run: cargo llvm-cov

      - name: Install security audit tool
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Package static release
        run: mise run release:package

      - name: Smoke-test exact release artifact
        run: |
          set -euo pipefail
          readonly archive="dist/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz"
          readonly checksum="dist/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256"
          test -f "${archive}"
          test -f "${checksum}"
          RELEASE_ARCHIVE="${archive}" VERIFIED_RELEASE_DIR=verified-release mise run release:smoke

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-static-release
          path: |
            verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz
            verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish verified static Linux release
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: verified-static-release
          path: verified-release

      - name: Create GitHub release
        run: |
          set -euo pipefail
          release_flags=(--repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" \
            "verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256" \
            "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
