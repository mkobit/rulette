name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  MISE_VERSION: "v2026.9.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-package:
    name: Validate and package static Linux release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install static-linking tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools binutils file

      - name: Install static Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Validate release tag
        run: |
          set -euo pipefail
          readonly package_version="$(scripts/cargo-package-version.sh)"
          readonly expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            printf 'release tag %s does not match Cargo package version %s\n' "${GITHUB_REF_NAME}" "${expected_tag}" >&2
            exit 1
          fi

      - name: Run quality gates
        run: mise run check

      - name: Validate OpenSpec changes
        run: mise run spec-validate

      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage gate
        run: cargo llvm-cov

      - name: Install security audit tool
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Package static release
        run: mise run release:package

      - name: Smoke-test exact release artifact
        run: |
          set -euo pipefail
          readonly archive="dist/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz"
          readonly checksum="dist/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256"
          test -f "${archive}"
          test -f "${checksum}"
          RELEASE_ARCHIVE="${archive}" VERIFIED_RELEASE_DIR=verified-release mise run release:smoke

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-static-release
          path: |
            verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz
            verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish verified static Linux release
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-static-release
          path: verified-release

      - name: Create GitHub release
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" \
            "verified-release/rulette-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
