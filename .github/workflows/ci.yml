name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Run mise check
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run check

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Test
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
