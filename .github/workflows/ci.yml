name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Test
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
