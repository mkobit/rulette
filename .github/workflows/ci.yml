name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_VERSION: "v2026.9.1"
  CARGO_TERM_COLOR: always

  RUST_BACKTRACE: 1

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run markdown lint
        run: bun x markdownlint-cli2

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v6.1.0
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v6.1.0
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Test and coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit
