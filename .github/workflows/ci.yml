name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: "v2026.5.15"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_USE_VERSIONS_HOST: 1
          MISE_RUST_DOWNLOAD: 1
      - name: Run markdown lint
        run: markdownlint-cli2

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_USE_VERSIONS_HOST: 1
          MISE_RUST_DOWNLOAD: 1

      - name: Debug toolchain
        run: |
          which cargo
          cargo --version
          which rustfmt || echo "rustfmt not found"

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v5.0.5
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_USE_VERSIONS_HOST: 1
          MISE_RUST_DOWNLOAD: 1

      - name: Debug toolchain
        run: |
          which cargo
          cargo --version
          which rustfmt || echo "rustfmt not found"

      - name: Set up rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache fixtures
        uses: actions/cache@v5.0.5
        with:
          path: target/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('build.rs') }}
          restore-keys: |
            fixtures-${{ runner.os }}-

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-llvm-cov

      - name: Test and coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
