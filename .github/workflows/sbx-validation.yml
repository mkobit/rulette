name: Docker Sandbox validation

on:
  push:
    branches: [main]
    paths:
      - '.sbx/**'
      - '.github/workflows/sbx-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.sbx/**'
      - '.github/workflows/sbx-validation.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: "v2026.9.1"
  SBX_VERSION: "v0.45.1"

permissions: {}

jobs:
  validate:
    name: Validate Docker Sandbox environments
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_USE_VERSIONS_HOST: 1

      - name: Cache sbx deb package
        uses: actions/cache@v6.1.0
        id: sbx-deb-cache
        with:
          path: /tmp/sbx.deb
          key: sbx-${{ env.SBX_VERSION }}-deb

      - name: Download sbx CLI
        if: steps.sbx-deb-cache.outputs.cache-hit != 'true'
        run: gh release download "${SBX_VERSION}" --repo docker/sbx-releases --pattern "DockerSandboxes-linux-amd64-ubuntu2404.deb" --output /tmp/sbx.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and start sbx CLI
        run: |
          sudo apt-get install -y /tmp/sbx.deb
          sbx daemon start -d

      - name: Validate Docker Sandbox environments
        run: mise run validate-sbx
