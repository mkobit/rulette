# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/v3.0.0-m.6/schema/kit.schema.json
schemaVersion: "2"
kind: mixin
name: rulette-toolchain
version: "0.2.0"
description: Bootstrap mise, bun, beads, and rust toolchain for rulette

permissions:
  network:
    allow:
      - mise.run
      - mise.jdx.dev
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - bun.sh
      - static.rust-lang.org
      - crates.io
      - index.crates.io
      - static.crates.io
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

environment:
  variables:
    MISE_YES: "1"

setup:
  install:
    - command: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential file musl-tools ripgrep
        rm -rf /var/lib/apt/lists/*
      description: "Install native build tools, file inspection, musl linkers, and search"
    - command: |
        curl -fsSL https://mise.run | MISE_VERSION=v2026.9.1 MISE_INSTALL_PATH=/usr/local/bin/mise sh
        printf '%s\n' 'export PATH="/home/agent/.local/share/mise/shims:/home/agent/.local/bin:$PATH"' > /etc/profile.d/mise.sh
        printf '%s\n' 'export PATH="/home/agent/.local/share/mise/shims:/home/agent/.local/bin:$PATH"' >> /etc/sandbox-persistent.sh
      description: "Install mise into /usr/local/bin and configure shell paths"
    - command: "mise settings set paranoid false && mise settings set yes true && mise install && mise exec -- rustup component add rustfmt clippy llvm-tools && mise reshim"
      user: "1000"
      description: "Install configured tools and required Rust components for agent"
    - command: |
        set -eu
        for tool in bun bd cargo cargo-clippy cargo-fmt rustc rustfmt rustup; do
          source="/home/agent/.local/share/mise/shims/$tool"
          target="/usr/local/bin/$tool"
          test -x "$source"
          if [ -e "$target" ] || [ -L "$target" ]; then
            if [ ! -L "$target" ] || [ "$(readlink -f "$target")" != /usr/local/bin/mise ]; then
              printf 'Refuse to replace unrelated executable: %s\n' "$target" >&2
              exit 1
            fi
          else
            ln -s "$source" "$target"
          fi
        done
      description: "Expose mise shims for direct execution without shell profiles"
