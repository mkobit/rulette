[package]
name = "rulette"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Michael Kobit <mkobit@google.com>"]
description = "Stateless CLI tool for transforming AI rules and skills across systems"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
pulldown-cmark = "0.13"
anyhow = "1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rulette"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
