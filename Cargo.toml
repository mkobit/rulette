[package]
name = "rulette"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Michael Kobit <mkobit@google.com>"]
description = "Stateless CLI tool for transforming AI rules and skills across systems"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
json5 = "0.4"
pulldown-cmark = "0.13"
anyhow = "1.0"
schemars = { version = "1.2", features = ["derive"] }
serde_yaml = "0.9.34"
clap-markdown = "0.1.5"
walkdir = "2.5.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
flate2 = "1.1.9"
tar = "0.4.45"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
rustix = { version = "1.1", features = ["fs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rulette"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.47.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[build-dependencies]
ureq = "3.3.0"
flate2 = "1.1.9"
tar = "0.4.45"
sha2 = "0.11"
hex = "0.4"
anyhow = "1.0"

[[bin]]
name = "gen_docs"
path = "src/bin/gen_docs.rs"


[workspace.metadata.llvm-cov]
workspace = true
fail-under-lines = 75
