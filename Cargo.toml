[package]
name = "rulette"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Michael Kobit <mkobit@google.com>"]
description = "Stateless CLI tool for transforming AI rules and skills across systems"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
pulldown-cmark = "0.13"
anyhow = "1.0"
schemars = { version = "1.2", features = ["derive"] }
serde_yaml = "0.9.34"
clap-markdown = "0.1.5"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rulette"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
assert_cmd = "2.2.0"
insta = "1.47.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[build-dependencies]
flate2 = "1.1.9"
tar = "0.4.45"
ureq = "3.3.0"

[[bin]]
name = "gen_docs"
path = "src/bin/gen_docs.rs"
